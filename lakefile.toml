name = "fab"
version = "0.1.0"
# axiom の監査（lake check）はデフォルトのビルド対象を見る。検証コアだけを対象にする。
defaultTargets = ["Fab"]
testDriver = "FabTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
linter.missingDocs = true

[[require]]
name = "plausible"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "Fab"          # 検証コア（P8 の禁止事項と axiom 監査の対象）

[[lean_lib]]
name = "FabCards"     # カード定義と具体的な CardDB

[[lean_lib]]
name = "FabDriver"    # 乱数の供給・自動対戦・ログ再生（IO を使う。監査の対象外）

[[lean_lib]]
name = "FabTest"      # テストドライバ

[[lean_exe]]
name = "fab-wasm"
root = "FabWasm"
